<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tur Muhasebe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #222535;
    --border: #2e3148; --text: #e8eaf0; --muted: #6b7099;
    --green: #2dd4a0; --red: #f06b6b; --yellow: #f5c842;
    --blue: #6b8ef0; --purple: #b06bf5; --accent: #5b6ef5;
    --pink: #f06bb0;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 10px; }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .summary { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; cursor:default; }
  .card .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .card .amount { font-size: 1.4rem; font-weight: 700; }
  .card.green .amount { color: var(--green); }
  .card.red .amount { color: var(--red); }
  .card.yellow .amount { color: var(--yellow); }
  .card.blue .amount { color: var(--blue); }
  .card.purple .amount { color: var(--purple); }
  .card.pink .amount { color: var(--pink); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 14px; font-size: 0.85rem; font-family: inherit; outline: none; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar input[type="text"] { flex: 1; min-width: 160px; }
  .btn { padding: 9px 18px; border-radius: 8px; border: none; font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ics { background: #1e3a5f; color: #6b8ef0; border: 1px solid #2e4a7f; }
  .btn-danger { background: #5f1e1e; color: #f08e8e; border: 1px solid #7f2e2e; }
  .btn-sm { padding: 5px 12px; font-size: 0.78rem; border-radius: 6px; border: none; font-family: inherit; font-weight: 600; cursor: pointer; }
  .rate-panel { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; color:var(--muted); font-size:.78rem; }
  .rate-panel label { display:flex; gap:5px; align-items:center; }
  .rate-panel input { width:80px; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:5px 7px; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 0.78rem; font-family: inherit; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; padding: 10px 14px; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid var(--border); }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 700; cursor: pointer;
    transition: all 0.15s; user-select: none; border: none;
    font-family: inherit;
  }
  .badge:hover { opacity: 0.8; transform: scale(0.97); }
  .badge.alindi { background: rgba(45,212,160,0.18); color: var(--green); border: 1px solid rgba(45,212,160,0.3); }
  .badge.alinmadi { background: rgba(240,107,107,0.18); color: var(--red); border: 1px solid rgba(240,107,107,0.3); }
  /* Kategori renkleri */
  .tip-gelir { color: var(--green); font-weight:600; }
  .tip-gider { color: var(--red); font-weight:600; }
  .tip-bahsis { color: var(--purple); font-weight:600; }
  .tip-komisyon { color: var(--pink); font-weight:600; }
  .tip-hizmet { color: var(--blue); font-weight:600; }
  /* Acenta ismi rengi */
  .acenta-name { color: var(--yellow); font-weight: 700; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 1.1rem; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 14px; font-size: 0.85rem; font-family: inherit; outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 8px; font-family: inherit; font-size: 0.85rem; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 0.9rem; }
  .cur-hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .cur-hint { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:0.72rem; margin-bottom:14px; padding: 10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; }
  .legend-item { display:flex; align-items:center; gap:5px; }
  .legend-dot { width:10px; height:10px; border-radius:50%; }
  @media (max-width: 900px) { .summary { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .summary { grid-template-columns: repeat(2, 1fr); } body { padding: 14px; } }
</style>
</head>
<body>

<header>
  <h1>Tur <span>Muhasebe</span></h1>
  <div class="header-actions">
    <button class="btn btn-ics" id="btn-yedekle">&#128190; Yedekle</button>
    <button class="btn btn-ics" id="btn-yedekten-yukle">&#128193; Yedekten Yukle</button>
    <input type="file" id="restore-file" accept="application/json,.json" style="display:none">
    <button class="btn btn-primary" id="btn-yeni">+ Kayit Ekle</button>
    <button class="btn btn-danger" id="btn-tumunu-kaldir">&#128465; Tumunu Kaldir</button>
  </div>
</header>

<div class="summary">
  <div class="card green"><div class="label">Toplam Gelir (Alinan)</div><div class="amount" id="sum-gelir">0</div></div>
  <div class="card green"><div class="label">Alindi</div><div class="amount" id="sum-alindi">0</div></div>
  <div class="card red"><div class="label">Alinacak</div><div class="amount" id="sum-alinmadi">0</div></div>
  <div class="card purple"><div class="label">Bahsis</div><div class="amount" id="sum-bahsis">0</div></div>
  <div class="card red"><div class="label">Gider</div><div class="amount" id="sum-gider">0</div></div>
  <div class="card pink"><div class="label">Komisyon</div><div class="amount" id="sum-komisyon">0</div></div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Ara...">
  <input type="month" id="filter-month">
  <select id="filter-tur"><option value="">Tum Acenteler</option></select>
</div>

<div class="rate-panel">
  <span>Kur:</span>
  <label>USD <input id="rate-usd" type="number" step="0.01" value="33"></label>
  <label>EUR <input id="rate-eur" type="number" step="0.01" value="36"></label>
  <label>GBP <input id="rate-gbp" type="number" step="0.01" value="42"></label>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="tumu">Tumu</button>
  <button class="filter-btn" data-filter="alindi">Alindi</button>
  <button class="filter-btn" data-filter="alinmadi">Alinmadi</button>
  <button class="filter-btn" data-filter="gider">Gider</button>
  <button class="filter-btn" data-filter="bahsis">Bahsis</button>
  <button class="filter-btn" data-filter="hizmet">Hizmet Ucreti</button>
  <button class="filter-btn" data-filter="komisyon">Komisyon</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Tarih</th>
        <th>Acenta / Sirket</th>
        <th>Aciklama</th>
        <th>Kategori</th>
        <th>Tutar</th>
        <th>Durum</th>
        <th>Islem</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">Kayit bulunamadi.</div>
</div>

<!-- Kayit Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2 id="modal-title">Yeni Kayit</h2>
    <div class="form-group"><label>Tarih</label><input type="date" id="f-tarih"></div>
    <div class="form-group"><label>Acenta / Sirket Adi</label><input type="text" id="f-tur" placeholder="IGLESIAS LIMAN, ANEX TUR MAVI..."></div>
    <div class="form-group"><label>Aciklama</label><input type="text" id="f-aciklama" placeholder="Musteri adi, tur detay..."></div>
    <div class="form-group">
      <label>Kategori</label>
      <select id="f-kategori">
        <option value="gelir">Gelir</option>
        <option value="hizmet">Hizmet Ucreti</option>
        <option value="bahsis">Bahsis (Tips)</option>
        <option value="komisyon">Komisyon</option>
        <option value="gider">Gider</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tutar</label>
      <input type="number" id="f-tutar" placeholder="4700">
    </div>
    <div class="form-group">
      <label>Para Birimi</label>
      <select id="f-doviz">
        <option value="TL">TL (Turk Lirasi)</option>
        <option value="USD">$ (Dolar)</option>
        <option value="EUR">€ (Euro)</option>
        <option value="GBP">£ (Sterlin)</option>
      </select>
      <div class="cur-hint" id="cur-hint"></div>
    </div>
    <div class="form-group" id="durum-group">
      <label>Durum</label>
      <select id="f-durum">
        <option value="alindi">ALINDI (Yesil)</option>
        <option value="alinmadi">ALINMADI (Kirmizi)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="btn-modal-iptal">Iptal</button>
      <button class="btn btn-primary" id="btn-modal-kaydet">Kaydet</button>
    </div>
  </div>
</div>

<script>
// =========================================================
// YARDIMCI FONKSIYONLAR
// =========================================================
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmt(n, doviz) {
  var num = Number(n) || 0;
  var s = Math.abs(num).toLocaleString('tr-TR', {minimumFractionDigits: 0, maximumFractionDigits: 2});
  var sem = (doviz && doviz !== 'TL') ? (doviz === 'USD' ? '$' : doviz === 'EUR' ? '€' : doviz === 'GBP' ? '£' : doviz) + ' ' : '';
  return (num < 0 ? '-' : '') + sem + s + ((!doviz || doviz === 'TL') ? ' TL' : '');
}

function parseMoney(value) {
  if (typeof value === 'number') return value;
  var s = String(value || '').trim().replace(/\s/g, '');
  if (!s) return 0;
  if (s.indexOf(',') !== -1 && s.indexOf('.') !== -1) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(/,/g, '');
    }
  } else if (s.indexOf(',') !== -1) {
    s = s.replace(',', '.');
  }
  return parseFloat(s) || 0;
}

// =========================================================
// DURUM & VERI
// =========================================================
var data = JSON.parse(localStorage.getItem('turmuhasebe') || '[]');
var editId = null;
var activeFilter = 'tumu';
var KURS = JSON.parse(localStorage.getItem('turmuhasebe_kurlar') || '{"TL":1,"USD":33,"EUR":36,"GBP":42}');

function save() { localStorage.setItem('turmuhasebe', JSON.stringify(data)); }

function saveKurs() { localStorage.setItem('turmuhasebe_kurlar', JSON.stringify(KURS)); }

function tlDeger(r) {
  return (Number(r.tutar) || 0) * (KURS[r.doviz] || 1);
}

function loadRateInputs() {
  ['USD','EUR','GBP'].forEach(function(c) {
    var el = document.getElementById('rate-' + c.toLowerCase());
    if (el) el.value = KURS[c];
  });
}

// =========================================================
// KUR GUNCELLEME
// =========================================================
['usd','eur','gbp'].forEach(function(c) {
  document.getElementById('rate-' + c).addEventListener('change', function() {
    var n = parseFloat(this.value);
    if (isFinite(n) && n > 0) {
      KURS[c.toUpperCase()] = n;
      saveKurs();
      render();
    }
  });
});

// =========================================================
// FILTRELER
// =========================================================
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    activeFilter = this.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    render();
  });
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-month').addEventListener('change', render);
document.getElementById('filter-tur').addEventListener('change', render);

// =========================================================
// RENDER
// =========================================================
function render() {
  var search = document.getElementById('search').value.toLowerCase();
  var month = document.getElementById('filter-month').value;
  var turFilter = document.getElementById('filter-tur').value;

  var rows = data.filter(function(r) {
    var haystack = (r.tur + ' ' + (r.aciklama || '')).toLowerCase();
    if (search && haystack.indexOf(search) === -1) return false;
    if (month && r.tarih.indexOf(month) !== 0) return false;
    if (turFilter && r.tur !== turFilter) return false;
    if (activeFilter === 'alindi' && r.durum !== 'alindi') return false;
    if (activeFilter === 'alinmadi' && r.durum !== 'alinmadi') return false;
    if (activeFilter === 'gider' && r.kategori !== 'gider') return false;
    if (activeFilter === 'bahsis' && r.kategori !== 'bahsis') return false;
    if (activeFilter === 'hizmet' && r.kategori !== 'hizmet') return false;
    if (activeFilter === 'komisyon' && r.kategori !== 'komisyon') return false;
    return true;
  }).sort(function(a, b) { return b.tarih.localeCompare(a.tarih); });

  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('empty');

  if (rows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = '';

    rows.forEach(function(r) {
      var kat = r.kategori || 'gelir';
      var katClass = {gelir:'tip-gelir', gider:'tip-gider', bahsis:'tip-bahsis', hizmet:'tip-hizmet', komisyon:'tip-komisyon'}[kat] || 'tip-gelir';
      var katLabel = {gelir:'Gelir', gider:'Gider', bahsis:'Bahsis', hizmet:'Hizmet Ucreti', komisyon:'Komisyon'}[kat] || kat;
      var alindi = r.durum === 'alindi';

      var tr = document.createElement('tr');

      // Tarih
      var td1 = document.createElement('td');
      td1.style.cssText = 'color:var(--muted);white-space:nowrap';
      td1.textContent = r.tarih.split('-').reverse().join('.');
      tr.appendChild(td1);

      // Acenta adi - sari renk
      var td2 = document.createElement('td');
      var acentaSpan = document.createElement('span');
      acentaSpan.className = 'acenta-name';
      acentaSpan.textContent = r.tur;
      td2.appendChild(acentaSpan);
      tr.appendChild(td2);

      // Aciklama
      var td3 = document.createElement('td');
      td3.style.color = 'var(--muted)';
      td3.textContent = r.aciklama || '—';
      tr.appendChild(td3);

      // Kategori
      var td4 = document.createElement('td');
      var katSpan = document.createElement('span');
      katSpan.className = katClass;
      katSpan.textContent = katLabel;
      td4.appendChild(katSpan);
      tr.appendChild(td4);

      // Tutar
      var td5 = document.createElement('td');
      td5.style.fontWeight = '600';
      td5.textContent = fmt(r.tutar, r.doviz);
      tr.appendChild(td5);

      // Durum badge
      var td6 = document.createElement('td');
      var badge = document.createElement('button');
      badge.className = 'badge ' + (alindi ? 'alindi' : 'alinmadi');
      badge.title = 'Tiklayarak degistir';
      badge.innerHTML = alindi ? '&#10003; ALINDI' : '&#10007; ALINMADI';
      badge.addEventListener('click', (function(id) {
        return function() { toggleDurum(id); };
      })(r.id));
      td6.appendChild(badge);
      tr.appendChild(td6);

      // Islemler
      var td7 = document.createElement('td');
      var editBtn = document.createElement('button');
      editBtn.className = 'btn-sm';
      editBtn.style.cssText = 'background:rgba(91,110,245,.15);color:var(--blue);margin-right:5px';
      editBtn.textContent = 'Duzenle';
      editBtn.addEventListener('click', (function(id) {
        return function() { openModal(id); };
      })(r.id));

      var delBtn = document.createElement('button');
      delBtn.className = 'btn-sm';
      delBtn.style.cssText = 'background:#3a1a1a;color:var(--red)';
      delBtn.textContent = 'Sil';
      delBtn.addEventListener('click', (function(id) {
        return function() { deleteRecord(id); };
      })(r.id));

      td7.appendChild(editBtn);
      td7.appendChild(delBtn);
      tr.appendChild(td7);

      tbody.appendChild(tr);
    });
  }

  // Ozet hesapla
  var gelirAlindi = 0, alindi = 0, alinmadi = 0, gider = 0, bahsis = 0, komisyon = 0, hizmet = 0;
  data.forEach(function(r) {
    var tl = tlDeger(r);
    var kat = r.kategori || 'gelir';
    if (kat === 'gider') {
      gider += tl;
    } else if (kat === 'bahsis') {
      bahsis += tl;
      if (r.durum === 'alindi') { gelirAlindi += tl; alindi += tl; } else { alinmadi += tl; }
    } else if (kat === 'komisyon') {
      komisyon += tl;
      if (r.durum === 'alindi') { gelirAlindi += tl; alindi += tl; } else { alinmadi += tl; }
    } else if (kat === 'hizmet') {
      hizmet += tl;
      if (r.durum === 'alindi') { gelirAlindi += tl; alindi += tl; } else { alinmadi += tl; }
    } else {
      // gelir
      if (r.durum === 'alindi') { gelirAlindi += tl; alindi += tl; } else { alinmadi += tl; }
    }
  });

  document.getElementById('sum-gelir').textContent = fmt(gelirAlindi);
  document.getElementById('sum-alindi').textContent = fmt(alindi);
  document.getElementById('sum-alinmadi').textContent = fmt(alinmadi);
  document.getElementById('sum-gider').textContent = fmt(gider);
  document.getElementById('sum-bahsis').textContent = fmt(bahsis);
  document.getElementById('sum-komisyon').textContent = fmt(komisyon);

  // Tur filtre listesi
  var turlar = [];
  data.forEach(function(r) { if (turlar.indexOf(r.tur) === -1) turlar.push(r.tur); });
  turlar.sort();
  var turSel = document.getElementById('filter-tur');
  var curVal = turSel.value;
  turSel.innerHTML = '<option value="">Tum Acenteler</option>';
  turlar.forEach(function(t) {
    var opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    if (t === curVal) opt.selected = true;
    turSel.appendChild(opt);
  });
}

// =========================================================
// MODAL - KAYIT EKLE / DUZENLE
// =========================================================
function openModal(id) {
  editId = id || null;
  document.getElementById('modal-title').textContent = editId ? 'Kaydi Duzenle' : 'Yeni Kayit';
  if (editId) {
    var r = data.find(function(x) { return x.id === editId; });
    if (!r) return;
    document.getElementById('f-tarih').value = r.tarih;
    document.getElementById('f-tur').value = r.tur;
    document.getElementById('f-aciklama').value = r.aciklama || '';
    document.getElementById('f-kategori').value = r.kategori || 'gelir';
    document.getElementById('f-tutar').value = r.tutar;
    document.getElementById('f-doviz').value = r.doviz || 'TL';
    document.getElementById('f-durum').value = r.durum || 'alindi';
  } else {
    document.getElementById('f-tarih').value = new Date().toISOString().split('T')[0];
    document.getElementById('f-tur').value = '';
    document.getElementById('f-aciklama').value = '';
    document.getElementById('f-kategori').value = 'gelir';
    document.getElementById('f-tutar').value = '';
    document.getElementById('f-doviz').value = 'TL';
    document.getElementById('f-durum').value = 'alindi';
  }
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

function toggleDurum(id) {
  var r = data.find(function(x) { return x.id === id; });
  if (!r) return;
  r.durum = r.durum === 'alindi' ? 'alinmadi' : 'alindi';
  save(); render();
}

function deleteRecord(id) {
  if (!confirm('Bu kaydi silmek istediginize emin misiniz?')) return;
  data = data.filter(function(r) { return r.id !== id; });
  save(); render();
}

function saveRecord() {
  var tarih = document.getElementById('f-tarih').value;
  var tur = document.getElementById('f-tur').value.trim().toUpperCase();
  var aciklama = document.getElementById('f-aciklama').value.trim();
  var kategori = document.getElementById('f-kategori').value;
  var tutar = parseMoney(document.getElementById('f-tutar').value);
  var doviz = document.getElementById('f-doviz').value;
  var durum = document.getElementById('f-durum').value;
  if (!tarih || !tur || !tutar) { alert('Tarih, Acenta/Sirket adi ve Tutar zorunludur!'); return; }
  if (editId) {
    var i = data.findIndex(function(x) { return x.id === editId; });
    if (i >= 0) data[i] = Object.assign({}, data[i], {tarih:tarih, tur:tur, aciklama:aciklama, kategori:kategori, tutar:tutar, doviz:doviz, durum:durum});
  } else {
    data.push({id: Date.now().toString(), tarih:tarih, tur:tur, aciklama:aciklama, kategori:kategori, tutar:tutar, doviz:doviz, durum:durum});
  }
  save(); closeModal(); render();
}

document.getElementById('btn-yeni').addEventListener('click', function() { openModal(null); });
document.getElementById('btn-modal-iptal').addEventListener('click', closeModal);
document.getElementById('btn-modal-kaydet').addEventListener('click', saveRecord);

// Modal disi tiklamada kapat
document.getElementById('modal-bg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

});

// =========================================================
// YEDEKLE / YEDEKTEN YUKLE
// =========================================================
function exportBackup() {
  var backup = {
    app: 'tur-muhasebe',
    version: 1,
    exportedAt: new Date().toISOString(),
    data: data,
    kurlar: KURS
  };
  var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var ts = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
  var a = document.createElement('a');
  a.href = url;
  a.download = 'tur-muhasebe-yedek-' + ts + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleRestoreFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var backup;
    try {
      backup = JSON.parse(e.target.result);
    } catch (err) {
      alert('Yedek dosyasi okunamadi: gecerli bir JSON dosyasi degil.');
      return;
    }
    if (!backup || !Array.isArray(backup.data)) {
      alert('Gecersiz yedek dosyasi. Lutfen bu uygulamadan alinmis bir "Yedekle" dosyasi (.json) secin.');
      return;
    }
    var onay = confirm(
      'Bu yedek dosyasi ' + backup.data.length + ' kayit iceriyor.\n' +
      'Yukleme yapilirsa mevcut TUM kayitlarin yerine bu yedekteki kayitlar gelecek.\n' +
      'Devam edilsin mi?'
    );
    if (!onay) return;
    data = backup.data;
    if (backup.kurlar) {
      KURS = backup.kurlar;
      saveKurs();
      loadRateInputs();
    }
    save();
    render();
    alert(data.length + ' kayit basariyla geri yuklendi.');
  };
  reader.readAsText(file, 'UTF-8');
}

document.getElementById('btn-yedekle').addEventListener('click', exportBackup);
document.getElementById('btn-yedekten-yukle').addEventListener('click', function() {
  document.getElementById('restore-file').click();
});
document.getElementById('restore-file').addEventListener('change', function() {
  if (this.files[0]) handleRestoreFile(this.files[0]);
  this.value = '';
});

function clearAllData() {
  if (!confirm('Tum muhasebe kayitlari silinecek. Emin misiniz?')) return;
  data = [];
  save();
  render();
}
