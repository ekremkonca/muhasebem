name: FX Cashbox Update

on:
  push:
    paths:
      - '.fx-cashbox-trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch accounting logic and cash FX card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tur-butcem-site/src/App.jsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)

          replace_once(
              'const EXPENSE_TYPES = new Set(["Tur Masrafı"]);\nconst pad = (n) => String(n).padStart(2, "0");',
              'const EXPENSE_TYPES = new Set(["Tur Masrafı"]);\nconst REALIZED_FX_EXCHANGES = [\n  { code: "USD", amount: 260, rate: 46.44 },\n  { code: "GBP", amount: 320, rate: 62.34 },\n  { code: "EUR", amount: 545, rate: 53.07 },\n];\nconst REALIZED_FX_TRY = REALIZED_FX_EXCHANGES.reduce(\n  (sum, item) => sum + item.amount * item.rate,\n  0,\n);\nconst CASH_FX_BALANCES = [\n  { code: "USD", amount: 159 },\n  { code: "EUR", amount: 123 },\n];\nconst pad = (n) => String(n).padStart(2, "0");',
              'FX constants',
          )

          replace_once(
              '  const income = paid.filter(isIncome).reduce((s, r) => s + convert(r), 0),\n    expense = paid.filter(isExpense).reduce((s, r) => s + convert(r), 0),',
              '  const income = paid\n      .filter((r) => normalizeType(r.type) === "Tur Geliri")\n      .reduce((s, r) => s + convert(r), 0),\n    expense = paid.filter(isExpense).reduce((s, r) => s + convert(r), 0),',
              'monthly report income',
          )

          replace_once(
              '(r.type === "Tur Masrafı" ? -convert(r) : convert(r))',
              '(normalizeType(r.type) === "Tur Masrafı" ? -convert(r) : normalizeType(r.type) === "Tur Geliri" ? convert(r) : 0)',
              'V8 trend income logic',
          )

          old_dashboard = (
              '  const paid = accountingRows.filter((r) => r.status === "Ödendi"),\n'
              '    income = paid.filter(isIncome).reduce((s, r) => s + accountingValue(r), 0),\n'
              '    expense = paid.filter(isExpense).reduce((s, r) => s + accountingValue(r), 0),\n'
              '    pending = accountingRows\n'
              '      .filter((r) => r.status === "Ödenmedi")\n'
              '      .reduce((s, r) => s + accountingOutstanding(r), 0),\n'
              '    net = income - expense,\n'
              '    tourCount = new Set(accountingRows.filter((r) => r.type === "Tur Geliri").map((r) => r.date)).size,\n'
              '    average = tourCount ? net / tourCount : 0;\n'
              "  const tipTotals = currencyTotals(accountingRows, 'Bahşiş', true);\n"
              "  const commissionTotals = currencyTotals(accountingRows, 'Komisyon');"
          )
          new_dashboard = (
              '  const paid = accountingRows.filter((r) => r.status === "Ödendi"),\n'
              '    tourIncome = paid\n'
              '      .filter((r) => normalizeType(r.type) === "Tur Geliri")\n'
              '      .reduce((s, r) => s + accountingValue(r), 0),\n'
              '    expense = paid.filter(isExpense).reduce((s, r) => s + accountingValue(r), 0),\n'
              '    pending = accountingRows\n'
              '      .filter((r) => r.status === "Ödenmedi")\n'
              '      .reduce((s, r) => s + accountingOutstanding(r), 0),\n'
              '    realizedFxValue = convertAmount(REALIZED_FX_TRY, "TRY", currency),\n'
              '    income = tourIncome + realizedFxValue,\n'
              '    operatingNet = tourIncome - expense,\n'
              '    net = operatingNet + realizedFxValue,\n'
              '    tourCount = new Set(accountingRows.filter((r) => r.type === "Tur Geliri").map((r) => r.date)).size,\n'
              '    average = tourCount ? operatingNet / tourCount : 0;\n'
              "  const tipTotals = currencyTotals(accountingRows, 'Bahşiş', true);\n"
              "  const commissionTotals = currencyTotals(accountingRows, 'Komisyon');\n"
              '  const cashFxTotals = CASH_FX_BALANCES.map((item) => ({ ...item }));\n'
              '  const cashFxTryValue = CASH_FX_BALANCES.reduce(\n'
              '    (sum, item) => sum + convertAmount(item.amount, item.code, "TRY"),\n'
              '    0,\n'
              '  );'
          )
          replace_once(old_dashboard, new_dashboard, 'dashboard totals')

          replace_once(
              '    paid\n      .filter(isIncome)\n      .forEach((r) => (m[r.tour] = (m[r.tour] || 0) + accountingValue(r)));',
              '    paid\n      .filter((r) => normalizeType(r.type) === "Tur Geliri")\n      .forEach((r) => (m[r.tour] = (m[r.tour] || 0) + accountingValue(r)));',
              'top tour logic',
          )

          replace_once(
              '        .filter((r) => r.date.startsWith(m) && r.status === "Ödendi")\n        .reduce((s, r) => s + (isExpense(r) ? -1 : 1) * accountingValue(r), 0);',
              '        .filter((r) => r.date.startsWith(m) && r.status === "Ödendi")\n        .reduce((s, r) => {\n          const type = normalizeType(r.type);\n          if (type === "Tur Masrafı") return s - accountingValue(r);\n          if (type === "Tur Geliri") return s + accountingValue(r);\n          return s;\n        }, 0);',
              'month delta logic',
          )

          replace_once(
              '            <small className="average-under-net">Tur başı ortalama · <AnimatedMoney value={average} currency={currency} /></small>',
              '            <small className="average-under-net">Tur başı ortalama · <AnimatedMoney value={average} currency={currency} /></small>\n            <small>Gerçekleşmiş döviz dahil · +{money(REALIZED_FX_TRY, "TRY")}</small>',
              'net realized FX note',
          )

          replace_once(
              '          <article className="average-kpi-legacy" aria-hidden="true" />',
              '          <article className="currency-totals-kpi cash-fx-kpi">\n            <span>Kasa Döviz</span>\n            <CurrencyDonuts totals={cashFxTotals} money={money} />\n            <small>TL karşılığı · <b>{money(cashFxTryValue, "TRY")}</b> · Net gelire dahil değil</small>\n          </article>',
              'cash FX card',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and clean temporary trigger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fx-cashbox-update.yml .fx-cashbox-trigger
          git add tur-butcem-site/src/App.jsx
          git commit -m "Separate realized FX and cash balances from net income"
          git push origin main
