name: Show Cashbox TRY
on:
  push:
    paths:
      - '.show-cashbox-try-trigger'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cashbox TRY total always visible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tur-butcem-site/src/App.jsx')
          s = p.read_text()
          old = '''          <article className="currency-totals-kpi cash-fx-kpi">\n            <span>Kasa Döviz</span>\n            <CurrencyDonuts totals={cashFxTotals} money={money} />\n            {cashFxTryBreakdown.map((item) => (\n              <small key={`cash-try-${item.code}`}>\n                {item.code}: {money(item.tryValue, "TRY")} · kur {item.rate.toFixed(2)}\n              </small>\n            ))}\n            <small><b>Toplam TL karşılığı · {money(cashFxTryValue, "TRY")}</b></small>\n            <small>Net gelire dahil değil</small>\n          </article>'''
          new = '''          <article className="currency-totals-kpi cash-fx-kpi">\n            <span>Kasa Döviz</span>\n            <div className="cash-fx-try-summary">\n              <small>Güncel TL karşılığı</small>\n              <strong>{money(cashFxTryValue, "TRY")}</strong>\n            </div>\n            <CurrencyDonuts totals={cashFxTotals} money={money} />\n            <div className="cash-fx-rate-breakdown">\n              {cashFxTryBreakdown.map((item) => (\n                <small key={`cash-try-${item.code}`}>\n                  {item.code}: {money(item.tryValue, "TRY")} · kur {item.rate.toFixed(2)}\n                </small>\n              ))}\n            </div>\n            <small className="cash-fx-net-note">Net gelire dahil değil</small>\n          </article>'''
          if old not in s:
              raise SystemExit('Cashbox card target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cat >> tur-butcem-site/src/styles/currency-donuts.css <<'CSS'
          .cash-fx-kpi{min-height:190px!important;overflow:visible!important}.cash-fx-try-summary{margin-top:7px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft,#f5f8f6);text-align:center}.cash-fx-try-summary small{display:block!important;font-size:9px!important;color:var(--muted)!important}.cash-fx-try-summary strong{display:block!important;margin:2px 0 0!important;font-size:18px!important;line-height:1.15!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;color:var(--ink)!important}.cash-fx-rate-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:5px}.cash-fx-rate-breakdown small,.cash-fx-net-note{display:block!important;visibility:visible!important;opacity:1!important;font-size:9px!important;line-height:1.3!important;color:var(--muted)!important}.cash-fx-net-note{text-align:center;margin-top:4px}
          CSS
      - name: Commit and clean
        shell: bash
        run: |
          rm -f .github/workflows/show-cashbox-try.yml .show-cashbox-try-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show cashbox TRY value prominently'
          git push
