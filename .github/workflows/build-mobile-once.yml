name: Build Mobile APK Once

on:
  push:
    paths:
      - '.mobile-apk-trigger'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-android/app/src/main/java/com/ekremkonca/rehberlikmuhasebe
          mkdir -p mobile-android/app/src/main/res/values
          mkdir -p mobile-android/app/src/main/res/drawable

          cat > mobile-android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'RehberlikMuhasebe'
          include ':app'
          EOF

          cat > mobile-android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > mobile-android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > mobile-android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ekremkonca.rehberlikmuhasebe'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ekremkonca.rehberlikmuhasebe'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > mobile-android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Rehberlik Muhasebe"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.RehberlikMuhasebe">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > mobile-android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.RehberlikMuhasebe" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#176B4D</item>
                  <item name="android:navigationBarColor">#176B4D</item>
                  <item name="android:windowBackground">#F3F6F3</item>
              </style>
          </resources>
          EOF

          cat > mobile-android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#176B4D" android:pathData="M8,8h92v92h-92z" />
              <path android:fillColor="#FFFFFF" android:pathData="M27,29h54v10h-54zM27,49h54v10h-54zM27,69h34v10h-34z" />
          </vector>
          EOF

          cat > mobile-android/app/src/main/java/com/ekremkonca/rehberlikmuhasebe/MainActivity.java <<'EOF'
          package com.ekremkonca.rehberlikmuhasebe;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String APP_URL = "https://rehberlikmuhasebe.pages.dev/";
              private static final String APP_HOST = "rehberlikmuhasebe.pages.dev";
              private WebView webView;
              private ProgressBar progressBar;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.rgb(243, 246, 243));

                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  FrameLayout.LayoutParams progressParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      6
                  );
                  progressParams.gravity = Gravity.TOP;
                  root.addView(progressBar, progressParams);

                  setContentView(root);
                  configureWebView();

                  if (savedInstanceState == null) {
                      webView.loadUrl(APP_URL);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              private void configureWebView() {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUserAgentString(settings.getUserAgentString() + " RehberlikMuhasebeAndroid/1.0");

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if ("https".equalsIgnoreCase(uri.getScheme()) && APP_HOST.equalsIgnoreCase(uri.getHost())) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {
                              Toast.makeText(MainActivity.this, "Bağlantı açılamadı.", Toast.LENGTH_SHORT).show();
                          }
                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progressBar.setProgress(newProgress);
                          progressBar.setVisibility(newProgress >= 100 ? ProgressBar.GONE : ProgressBar.VISIBLE);
                      }
                  });
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/build-android-apk.yml <<'EOF'
          name: Build Android APK

          on:
            workflow_dispatch:
            push:
              paths:
                - 'mobile-android/**'

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v3
                - name: Install Android SDK
                  run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
                - uses: gradle/actions/setup-gradle@v4
                  with:
                    gradle-version: '8.10.2'
                - name: Build debug APK
                  run: gradle -p mobile-android --no-daemon :app:assembleDebug
                - uses: actions/upload-artifact@v4
                  with:
                    name: Rehberlik-Muhasebe-APK
                    path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
                    if-no-files-found: error
          EOF

          rm -f .github/workflows/build-mobile-once.yml .mobile-apk-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-android .github/workflows/build-android-apk.yml .github/workflows/build-mobile-once.yml .mobile-apk-trigger
          git commit -m "Add Android APK wrapper for Rehberlik Muhasebe"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p mobile-android --no-daemon :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rehberlik-Muhasebe-APK
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile-android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="mobile-v1.0.0"
          TARGET="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#RehberlikMuhasebe.apk" --clobber
          else
            gh release create "$TAG" "$APK#RehberlikMuhasebe.apk" --target "$TARGET" --title "Rehberlik Muhasebe Android v1.0.0" --notes "Android WebView APK. Canlı rehberlikmuhasebe.pages.dev sitesini kullanır; D1 verileri web sürümüyle ortaktır."
          fi
