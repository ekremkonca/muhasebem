name: Net FX Fix

on:
  push:
    paths:
      - '.net-fix-trigger-v3'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.jsx
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tur-butcem-site/src/App.jsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const accountingValue = (r) => keepNativeCurrency(r) ? 0 : converted(r);\n  const accountingOutstanding = (r) =>\n    keepNativeCurrency(r) ? 0 : convertedOutstanding(r);'''
          new = '''  const accountingValue = (r) => converted(r);\n  const accountingOutstanding = (r) => convertedOutstanding(r);'''

          if old not in text:
              raise SystemExit('Target accounting snippet not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit result and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/net-fx-fix-v3.yml .github/workflows/fix-net-native-currency-v2.yml .github/workflows/fix-net-native-currency.yml .net-fix-trigger .net-fix-trigger-v3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Include FX tips and commissions in net income'
          git push
