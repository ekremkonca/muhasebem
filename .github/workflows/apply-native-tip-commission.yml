name: Apply native currency rule for tips and commissions

on:
  push:
    paths:
      - '.github/workflows/apply-native-tip-commission.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch accounting currency behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tur-butcem-site/src/App.jsx')
          text = path.read_text(encoding='utf-8')

          def repl(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              text = text.replace(old, new, 1)

          repl(
          '''  const converted = (r) => convertAmount(r.amount, r.currency, currency);\n  const convertedOutstanding = (r) =>\n    convertAmount(Math.max(0, r.amount - r.paid_amount), r.currency, currency);''',
          '''  const converted = (r) => convertAmount(r.amount, r.currency, currency);\n  const convertedOutstanding = (r) =>\n    convertAmount(Math.max(0, r.amount - r.paid_amount), r.currency, currency);\n  const keepNativeCurrency = (r) =>\n    ["Bahşiş", "Komisyon"].includes(normalizeType(r.type)) &&\n    normalizeCurrency(r.currency) !== currency;\n  const accountingValue = (r) => keepNativeCurrency(r) ? 0 : converted(r);\n  const accountingOutstanding = (r) =>\n    keepNativeCurrency(r) ? 0 : convertedOutstanding(r);''',
          'native accounting helpers')

          repl(
          '''  const paid = accountingRows.filter((r) => r.status === "Ödendi"),\n    income = paid.filter(isIncome).reduce((s, r) => s + converted(r), 0),\n    expense = paid.filter(isExpense).reduce((s, r) => s + converted(r), 0),\n    pending = accountingRows\n      .filter((r) => r.status === "Ödenmedi")\n      .reduce((s, r) => s + convertedOutstanding(r), 0),''',
          '''  const paid = accountingRows.filter((r) => r.status === "Ödendi"),\n    income = paid.filter(isIncome).reduce((s, r) => s + accountingValue(r), 0),\n    expense = paid.filter(isExpense).reduce((s, r) => s + accountingValue(r), 0),\n    pending = accountingRows\n      .filter((r) => r.status === "Ödenmedi")\n      .reduce((s, r) => s + accountingOutstanding(r), 0),''',
          'dashboard totals')

          repl(
          '''  const commissionTotals = currencyTotals(accountingRows, 'Komisyon').filter(item => item.code !== 'GBP');''',
          '''  const commissionTotals = currencyTotals(accountingRows, 'Komisyon');''',
          'commission GBP filter')

          text = text.replace('(m[r.tour] || 0) + converted(r)', '(m[r.tour] || 0) + accountingValue(r)')
          text = text.replace('(m[k] || 0) + converted(r)', '(m[k] || 0) + accountingValue(r)')
          text = text.replace('(isExpense(r) ? -1 : 1) * converted(r)', '(isExpense(r) ? -1 : 1) * accountingValue(r)')
          text = text.replace('.reduce((s, r) => s + convertedOutstanding(r), 0);', '.reduce((s, r) => s + accountingOutstanding(r), 0);')
          text = text.replace('reduce((s, r) => s + convertedOutstanding(r), 0);', 'reduce((s, r) => s + accountingOutstanding(r), 0);')
          text = text.replace('convert={converted}', 'convert={accountingValue}')

          repl(
          '''                        <td className="right amount record-amount" data-label="Tutar">\n                          <strong>{money(converted(r), currency)}</strong>\n                          {r.status === "Ödenmedi" && <small>Kalan: {money(convertedOutstanding(r), currency)}</small>}\n                          {r.currency !== currency && (\n                            <small>{money(r.amount, r.currency)}</small>\n                          )}\n                        </td>''',
          '''                        <td className="right amount record-amount" data-label="Tutar">\n                          <strong>{keepNativeCurrency(r) ? money(r.amount, r.currency) : money(converted(r), currency)}</strong>\n                          {r.status === "Ödenmedi" && <small>Kalan: {keepNativeCurrency(r) ? money(Math.max(0, r.amount - r.paid_amount), r.currency) : money(convertedOutstanding(r), currency)}</small>}\n                          {r.currency !== currency && !keepNativeCurrency(r) && (\n                            <small>{money(r.amount, r.currency)}</small>\n                          )}\n                        </td>''',
          'record amount display')

          repl(
          '''                      rows\n                        .filter((r) => r.status === "Ödenmedi")\n                        .reduce((s, r) => s + convertedOutstanding(r), 0),''',
          '''                      rows\n                        .filter((r) => r.status === "Ödenmedi")\n                        .reduce((s, r) => s + accountingOutstanding(r), 0),''',
          'receivables total')

          repl(
          '''                      <strong>{money(convertedOutstanding(r), currency)}</strong>''',
          '''                      <strong>{keepNativeCurrency(r) ? money(Math.max(0, r.amount - r.paid_amount), r.currency) : money(convertedOutstanding(r), currency)}</strong>''',
          'receivable row display')

          repl(
          '''  const reportText = [\n    `REHBERLİK MUHASEBE — ${month}`,''',
          '''  const nativeSummary = (type) => currencyTotals(paid, type)\n    .filter((item) => item.amount !== 0)\n    .map((item) => money(item.amount, item.code))\n    .join(" · ") || money(0, "TRY");\n  const reportText = [\n    `REHBERLİK MUHASEBE — ${month}`,''',
          'report native summary helper')

          text = text.replace('`Bahşiş: ${money(tips, currency)}`', '`Bahşiş: ${nativeSummary("Bahşiş")}`')
          text = text.replace('`Komisyon: ${money(commission, currency)}`', '`Komisyon: ${nativeSummary("Komisyon")}`')
          text = text.replace('<strong>{money(tips, currency)}</strong>', '<strong>{nativeSummary("Bahşiş")}</strong>')
          text = text.replace('<strong>{money(commission, currency)}</strong>', '<strong>{nativeSummary("Komisyon")}</strong>')

          repl(
          '''                  <td className="right">{money(convert(r), currency)}</td>''',
          '''                  <td className="right">{["Bahşiş", "Komisyon"].includes(normalizeType(r.type)) && normalizeCurrency(r.currency) !== currency ? money(r.amount, r.currency) : money(convert(r), currency)}</td>''',
          'report row amount display')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-native-tip-commission.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep tips and commissions in native currency'
          git push
